<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Type-o-meter | Monochrome</title>
    <!-- Tailwind and Fonts from Stitch Design -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ffffff",
              "on-surface-variant": "#c6c6c6",
              "surface-bright": "#393939",
              "outline": "#919191",
              "surface-container-highest": "#353534",
              "surface": "#131313",
              "outline-variant": "#474747",
              "on-primary": "#1a1c1c",
              "surface-container": "#201f1f",
              "surface-container-high": "#2a2a2a",
              "error-container": "#93000a",
              "secondary": "#71d7cd",
              "surface-container-low": "#1c1b1b",
              "error": "#ffb4ab",
              "on-surface": "#e5e2e1"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Space Grotesk"],
              "mono": ["JetBrains Mono"]
            },
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .typing-area-glass { background: rgba(53, 53, 52, 0.6); backdrop-filter: blur(20px); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #131313; }
        ::-webkit-scrollbar-thumb { background: #353534; border-radius: 10px; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-secondary/30 relative min-h-screen flex flex-col">
    
    <!-- TopNavBar -->
    <nav class="w-full top-0 sticky bg-[#131313] z-50">
        <div class="flex justify-between items-center max-w-7xl mx-auto px-8 py-6">
            <div class="text-2xl font-bold tracking-tighter text-white font-headline uppercase">
                
            </div>
            <div class="hidden md:flex items-center space-x-8 text-on-surface-variant text-sm font-headline tracking-widest uppercase">
                <span>Precision Typing</span>
            </div>
        </div>
        <div class="bg-gradient-to-b from-[#1c1b1b] to-transparent h-px"></div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-7xl mx-auto z-10 relative w-full">
        <section class="w-full max-w-4xl flex flex-col items-center">
            
            <!-- Real-Time Stats Bar -->
            <div class="w-full grid grid-cols-4 gap-4 mb-12 text-center bg-surface-container-low p-6 py-8 rounded-xl border border-outline-variant/30 shadow-lg">
                <div class="group">
                    <p class="text-[10px] md:text-xs font-label text-on-surface-variant uppercase tracking-[0.2em] mb-2">WPM</p>
                    <p class="text-5xl font-headline font-bold text-primary transition-all" id="wpm-display">0</p>
                </div>
                <div class="group">
                    <p class="text-[10px] md:text-xs font-label text-on-surface-variant uppercase tracking-[0.2em] mb-2">CPM</p>
                    <p class="text-5xl font-headline font-bold text-primary transition-all" id="cpm-display">0</p>
                </div>
                <div class="group border-x border-outline-variant/20 px-2">
                    <p class="text-[10px] md:text-xs font-label text-on-surface-variant uppercase tracking-[0.2em] mb-2">Accuracy</p>
                    <p class="text-5xl font-headline font-bold text-primary transition-all"><span id="acc-display">0</span><span class="text-2xl text-on-surface-variant ml-1">%</span></p>
                </div>
                <div class="group text-right pr-4">
                    <p class="text-[10px] md:text-xs font-label text-on-surface-variant uppercase tracking-[0.2em] mb-2 text-center">Timer</p>
                    <div class="text-5xl font-headline font-bold text-secondary text-center w-full">
                        00:<span id="timer-display">60</span>
                    </div>
                </div>
            </div>

            <!-- Typing Canvas -->
            <div class="w-full relative">
                <div class="absolute inset-0 -m-8 bg-surface-container-highest rounded-2xl opacity-30 blur-2xl z-0"></div>
                <div class="relative typing-area-glass rounded-2xl p-8 lg:p-14 min-h-[300px] flex flex-col shadow-2xl z-10 border border-outline-variant/40">
                    
                    <div id="prompt-box" class="font-mono text-xl md:text-3xl leading-relaxed tracking-tight text-on-surface-variant select-none mb-8 max-h-[150px] overflow-hidden">
                        Press 'Start' to begin...
                    </div>
                    
                    <div class="relative w-full mt-auto">
                        <textarea id="input-box" class="w-full bg-surface-container/30 border-b-2 border-outline-variant focus:border-secondary focus:bg-surface-container text-xl md:text-2xl font-mono text-primary outline-none transition-all p-4 resize-none rounded-t-sm" rows="3" placeholder="Type here..." disabled autocomplete="off" spellcheck="false"></textarea>
                    </div>

                    <div class="mt-10 flex justify-center items-center gap-6 w-full">
                        <button id="btn-start" class="group flex items-center gap-3 px-10 py-4 bg-primary text-on-primary rounded-lg font-bold uppercase tracking-widest text-sm transition-all hover:bg-secondary shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(113,215,205,0.4)]">
                            <span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">bolt</span>
                            Start Session
                        </button>
                        <button id="btn-reset" class="flex items-center gap-3 px-10 py-4 bg-surface-bright text-on-surface rounded-lg border border-transparent font-bold uppercase tracking-widest text-sm transition-all hover:border-outline-variant hover:bg-surface-container-highest">
                            <span class="material-symbols-outlined text-lg">refresh</span>
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer from Stitch Design -->
    <footer class="w-full py-8 bg-surface border-t border-outline-variant/20 mt-auto z-20 relative">
        <div class="flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto px-8 opacity-60 hover:opacity-100 transition-opacity">
            <p class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] text-[#c6c6c6]">
                © 2024 DIGITAL OBSIDIAN. TYPE WITH FOCUS.
            </p>
            <div class="flex gap-8 mt-6 md:mt-0">
                <a class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] text-[#c6c6c6] hover:text-[#71d7cd] transition-all" href="https://github.com/GaganpreetKaurKalsi">Github</a>
                <a class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] text-[#c6c6c6] hover:text-[#71d7cd] transition-all" href="https://www.linkedin.com/in/gaganpreet-kaur-kalsi-2a6650191/">LinkedIn</a>
                <a class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] text-[#c6c6c6] hover:text-[#71d7cd] transition-all" href="https://www.instagram.com/gagan_singhkalsi11/">Instagram</a>
            </div>
        </div>
    </footer>

    <!-- Visual Polish: Subtle Grain Overlay -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay z-[1] select-none">
        <svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
            <filter id="n" x="0" y="0"><feturbulence basefrequency="0.65" stitchtiles="stitch" type="fractalNoise"></feturbulence></filter>
            <rect filter="url(#n)" height="100%" width="100%"></rect>
        </svg>
    </div>

    <!-- Minimal Script -->
    <script src="js-files/script.js"></script>
</body>
</html>
