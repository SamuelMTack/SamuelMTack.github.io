<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Weather Observer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Manrope:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-tertiary-fixed": "#003150",
                "surface-container-low": "#131313",
                "primary-fixed-dim": "#d4d4d4",
                "tertiary-fixed-dim": "#91c0ef",
                "tertiary-fixed": "#9fcefe",
                "tertiary-dim": "#91c0ef",
                "error-dim": "#bb5551",
                "surface-tint": "#c6c6c7",
                "on-primary": "#3f4041",
                "primary": "#c6c6c7",
                "surface-container": "#191a1a",
                "surface-container-highest": "#252626",
                "error": "#ee7d77",
                "on-surface": "#e7e5e5",
                "secondary-fixed-dim": "#d6d4d3",
                "secondary-dim": "#9f9d9d",
                "secondary-fixed": "#e4e2e1",
                "background": "#0e0e0e",
                "error-container": "#7f2927",
                "tertiary": "#b9dbff",
                "primary-dim": "#b8b9b9",
                "surface": "#0e0e0e",
                "on-tertiary-fixed-variant": "#174e77",
                "surface-variant": "#252626",
                "inverse-primary": "#5e5f60",
                "inverse-surface": "#fcf9f8",
                "on-secondary-container": "#c1bfbe",
                "surface-container-high": "#1f2020",
                "on-tertiary": "#174e77",
                "on-surface-variant": "#acabaa",
                "on-tertiary-container": "#07456e",
                "on-background": "#e7e5e5",
                "outline-variant": "#484848",
                "surface-dim": "#0e0e0e",
                "on-secondary-fixed-variant": "#5c5b5b",
                "primary-container": "#454747",
                "on-error": "#490106",
                "inverse-on-surface": "#565555",
                "outline": "#767575",
                "surface-bright": "#2b2c2c",
                "on-primary-container": "#d0d0d0",
                "surface-container-lowest": "#000000",
                "secondary-container": "#3b3b3b",
                "on-secondary": "#202020",
                "on-primary-fixed-variant": "#5a5c5c",
                "tertiary-container": "#9fcefe",
                "on-secondary-fixed": "#3f3f3f",
                "on-primary-fixed": "#3e4040",
                "on-error-container": "#ff9993",
                "primary-fixed": "#e2e2e2",
                "secondary": "#9f9d9d"
              },
              fontFamily: {
                "headline": ["Manrope"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .text-shadow-sm {
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        body {
            background-color: #0e0e0e;
        }
        .hide {
            display: none !important;
        }
    </style>
</head>
<body class="font-body text-on-surface selection:bg-tertiary selection:text-on-tertiary-container min-h-screen relative">
    
    <!-- TopAppBar Shell -->
    <header class="w-full top-0 px-6 pt-8 pb-4 bg-transparent no-border space-y-4 flex flex-col md:flex-row justify-between items-center w-full max-w-screen-xl mx-auto z-40">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
        </div>
        <div class="flex-1 w-full max-w-md mx-0 md:mx-8 mt-4 md:mt-0">
            <div class="w-full relative">
                <input id="input-box" class="w-full bg-surface-container-highest border-none rounded-full py-3 px-6 text-on-surface placeholder:text-on-surface-variant focus:ring-1 focus:ring-tertiary/30 outline-none transition-all shadow-lg" placeholder="Search city..." type="text" autocomplete="off" spellcheck="false"/>
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-4">
            <button class="p-2 rounded-full hover:bg-slate-800/40 transition-colors scale-95 active:duration-150 text-slate-200">
                <span class="material-symbols-outlined">more_vert</span>
            </button>
        </div>
    </header>

    <!-- Empty State -->
    <div id="empty-state" class="w-full flex flex-col items-center justify-center pt-32 text-on-surface-variant opacity-60">
        <span class="material-symbols-outlined text-8xl mb-6 font-light">explore</span>
        <h2 class="text-2xl font-headline font-light tracking-wide">Enter a city to observe atmospheric conditions</h2>
    </div>

    <main id="weather-dashboard" class="max-w-screen-xl mx-auto px-6 pt-4 pb-32 hide">
        <!-- Hero Section: Current Weather -->
        <section class="mb-16">
            <div class="relative overflow-hidden rounded-3xl bg-surface-container-low p-8 md:p-12 lg:p-16 flex flex-col md:flex-row justify-between items-start md:items-center min-h-[400px] shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                <!-- Subtle Gradient Texture -->
                <div class="absolute inset-0 bg-gradient-to-br from-tertiary/5 via-transparent to-on-tertiary-container/10 pointer-events-none"></div>
                <div class="relative z-10 space-y-2">
                    <div class="flex items-center gap-2 text-tertiary mb-4">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
                        <span id="city-display" class="text-label-md font-medium tracking-wide font-body uppercase">LONDON, UK</span>
                    </div>
                    <h1 class="text-8xl md:text-[140px] leading-none font-extrabold font-headline tracking-tighter text-on-surface flex items-start">
                        <span id="temp-display">22</span><span class="text-5xl md:text-7xl font-light mt-4 md:mt-8 ml-2 text-tertiary-dim">°F</span>
                    </h1>
                    <p id="condition-display" class="text-xl md:text-3xl font-body text-on-surface-variant font-light capitalize mt-4">Partly Cloudy</p>
                    <div class="pt-6 flex gap-4">
                        <span class="px-5 py-2 rounded-full bg-secondary-container text-on-secondary-container text-xs font-semibold tracking-widest uppercase">High <span id="high-temp">24</span>°</span>
                        <span class="px-5 py-2 rounded-full bg-surface-container-highest text-on-surface-variant border border-outline-variant/30 text-xs font-semibold tracking-widest uppercase">Low <span id="low-temp">16</span>°</span>
                    </div>
                </div>
                <div class="relative z-10 mt-12 md:mt-0 flex flex-col items-center md:items-end">
                    <!-- Hero Icon Asymmetry -->
                    <div class="relative" id="hero-icon-container">
                        <span id="hero-icon" class="material-symbols-outlined text-[160px] md:text-[240px] leading-none text-tertiary drop-shadow-2xl" style="font-variation-settings: 'FILL' 1;">cloud_queue</span>
                    </div>
                    <p id="last-updated" class="text-[10px] md:text-xs font-body text-on-surface-variant/60 mt-8 tracking-widest uppercase">Updated moments ago</p>
                </div>
            </div>
        </section>


    </main>

    <script src="script.js"></script>
</body>
</html>
